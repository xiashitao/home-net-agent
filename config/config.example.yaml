# ==============================================================
# 家庭网络管理 Agent (Home Network Agent) 配置文件示例
# 复制本文件为 config.yaml 并填入实际参数
# ==============================================================

# 旁路由与 Nikki (Mihomo/Clash.Meta) 配置
nikki:
  # 旁路由在局域网中的 IP 地址 (例如 192.168.1.2 或 192.168.31.2)
  host: "192.168.1.2"
  # Nikki (Mihomo) External Controller API 端口 (默认 9090)
  port: 9090
  # API 鉴权密钥 (Secret)，如果在 Nikki 网页中未设置可留空
  secret: ""
  # 机场订阅地址 (可选): 填写后可查询流量余额/到期时间
  # 查看方式: 机场官网 → 订阅/一键订阅 → 复制 Clash 订阅链接
  # 填写后支持: AI 对话问“流量还剩多少” / Web 控制台订阅卡片 / 早间日报自动播报
  # subscription_url: "https://example-airport.com/api/v1/client/subscribe?token=xxxx"
  # 默认用于测速的目标 URL
  test_url: "https://www.gstatic.com/generate_204"
  # 测速超时时间 (毫秒)
  timeout_ms: 3000

# OpenWrt 旁路由系统 SSH 访问配置
openwrt:
  host: "192.168.1.2"
  port: 22
  username: "root"
  # 密码或者私钥路径选其一
  password: "your_openwrt_password"
  private_key_path: ""
  # 无线网卡接口名称 (通常为 wlan0、radio0 或 wl-lan)
  wifi_interface: "wlan0"

# 大模型服务配置 (用于意图理解与工具调用)
llm:
  # 供应商: 可使用 "openai" (兼容 deepseek/qwen/moonshot) 或 "gemini"
  provider: "openai"
  # API 请求地址 (例如 deepseek: https://api.deepseek.com/v1, 或 OpenAI: https://api.openai.com/v1)
  base_url: "https://api.deepseek.com/v1"
  api_key: "your_llm_api_key_here"
  model: "deepseek-chat"
  temperature: 0.2

# 飞书机器人配置 (使用自建应用 WebSocket 长连接模式，无需公网 IP)
feishu:
  app_id: "cli_a1b2c3d4e5f6g7h8"
  app_secret: "your_feishu_app_secret"
  # 允许接收指令和接收告警的用户 Open ID (白名单保护，防止他人误触)
  admin_open_ids:
    - "ou_xxxxxxxxxxxxxxxxxxxxxx"

# 后台主动巡检守护进程配置
watchdog:
  enabled: true
  # 巡检间隔 (分钟)
  interval_minutes: 5
  # 触发告警的延迟阈值 (毫秒)
  high_latency_threshold_ms: 600
  # 触发自愈切换备用节点的连续失败次数
  failure_threshold_count: 2
  # 主动汇报网络日报的每日触发时间 (24小时制，留空则不发)
  daily_report_time: "09:00"

# 受保护服务声明 (Layer 1/2 智能护栏: Agent 测速推荐与节点切换时自动避开禁用节点)
# 场景示例: Gemini 不对中国香港/澳门地区提供服务，若当前节点落在这些地区会直接报错
protected_services:
  - name: "Gemini (Google AI)"
    domains: ["googleapis.com", "gemini.google.com", "ai.google.dev"]
    forbidden_node_keywords: ["香港", "HK", "Hong Kong", "澳门", "Macao", "Macau"]
    advice: "Gemini 不支持香港/澳门节点，请切换到 美国/日本/新加坡/台湾 等受支持地区的节点"
  # 按需追加其他受限服务，例如:
  # - name: "ChatGPT (OpenAI)"
  #   domains: ["openai.com", "chatgpt.com", "oaistatic.com"]
  #   forbidden_node_keywords: ["俄罗斯", "RU"]
  #   advice: "OpenAI 不支持俄罗斯等地区节点"

# 局域网 Web 控制台配置 (支持手机/电脑通过浏览器在局域网内直接访问)
web:
  enabled: true
  # 绑定地址: 0.0.0.0 代表监听所有网卡，允许局域网外部设备访问
  host: "0.0.0.0"
  # 网页访问端口 (例如 http://<家庭服务器IP>:8080)
  port: 8080
